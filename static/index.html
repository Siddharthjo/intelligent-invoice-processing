<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Intelligent Invoice Processing — Agent Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
  }
  a { color: var(--accent); }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.15rem 2rem;
    border-bottom: 1px solid var(--hairline);
  }
  header h1 {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    margin: 0;
  }
  .header-actions { display: flex; gap: 0.5rem; align-items: center; }
  .user-info { font-size: 0.8rem; color: var(--muted); margin-right: 0.5rem; }
  .user-info .role { text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.7rem; }

  #login-view {
    max-width: 320px; margin: 6rem auto 0; padding: 0 1rem;
  }

  main { max-width: 1180px; margin: 0 auto; padding: 2.5rem 2rem 6rem; }

  /* upload zone */
  #upload-zone {
    border: 1.5px dashed var(--hairline-strong);
    border-radius: 8px;
    padding: 6rem 2rem;
    text-align: center;
    color: var(--muted);
    margin-top: 2.5rem;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
  }
  #upload-zone.dragover { border-color: var(--accent); background: var(--accent-wash); }
  #upload-zone .upload-hint { font-size: 1rem; margin: 0 0 1.25rem; }
  #upload-zone .upload-subhint { font-size: 0.8rem; margin-top: 0.75rem; }

  /* ledger sections */
  .source-line { font-size: 0.92rem; color: var(--muted); margin: 0 0 1.75rem; }
  .source-line strong { color: var(--ink); font-weight: 500; }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 3rem; }
  .field-row { display: flex; padding: 0.4rem 0; gap: 1rem; font-size: 0.88rem; border-bottom: 1px solid var(--hairline); }
  .field-row .label { width: 130px; flex-shrink: 0; color: var(--muted); }
  .field-row .value { flex: 1; }

  .issue-list, .history-list { list-style: none; padding: 0; margin: 1.25rem 0 0; font-size: 0.85rem; }
  .issue-list li, .history-list li { padding: 0.6rem 0; border-bottom: 1px solid var(--hairline); }
  .issue-list li:first-child, .history-list li:first-child { padding-top: 0; }
  .issue-tag { font-size: 0.78rem; }
  .issue-severity { color: var(--muted); font-size: 0.8rem; margin-left: 0.4rem; }
  .issue-message { margin-top: 0.25rem; color: var(--ink); }
  .history-list li { display: flex; align-items: baseline; gap: 0.75rem; }
  .history-list .ts { color: var(--muted); font-size: 0.78rem; }
  .history-list .reason { color: var(--muted); }

  /* trace terminal */
  #trace-terminal {
    background: var(--terminal-bg); color: var(--terminal-text);
    border-radius: 6px; padding: 1.4rem 1.6rem; margin-top: 1.1rem;
    font-size: 0.8rem; line-height: 1.75; overflow-x: auto;
  }
  .trace-call-line, .trace-result-line { white-space: pre; }
  .trace-ts { color: var(--terminal-muted); margin-right: 0.9rem; }
  .trace-ts-spacer { display: inline-block; margin-right: 0.9rem; }
  .trace-call { color: var(--terminal-call); }
  .trace-result { color: var(--terminal-text); opacity: 0.82; }
  .trace-result.warn { color: var(--terminal-warn); opacity: 1; }
  .trace-empty { color: var(--terminal-muted); }

  /* decision */
  .decision-recommend { color: var(--muted); font-size: 0.85rem; margin-left: 0.75rem; }
  .decision-reasoning {
    font-style: italic; color: var(--ink); border-left: 2px solid var(--hairline-strong);
    padding-left: 1rem; margin: 1.1rem 0; font-size: 0.92rem; max-width: 640px;
  }
  .termination-warning { color: var(--dot-bad); font-size: 0.82rem; margin: 0.75rem 0; }
  .concern-tag {
    font-size: 0.75rem; color: var(--muted); border: 1px solid var(--hairline-strong);
    border-radius: 3px; padding: 0.15rem 0.5rem; margin: 0 0.5rem 0.4rem 0; display: inline-block;
  }
  .decision-meta { font-size: 0.78rem; color: var(--muted); margin-top: 1rem; }

  .action-row { margin-top: 1.5rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  #return-reason-panel { margin-top: 1rem; max-width: 480px; }
  #return-reason-input {
    width: 100%; font-family: inherit; font-size: 0.85rem;
    padding: 0.6rem; border: 1px solid var(--hairline-strong); border-radius: 4px; resize: vertical;
    background: #fff; color: var(--ink);
  }
  #action-result { margin-top: 0.85rem; font-size: 0.85rem; }

  /* recent drawer */
  #recent-scrim {
    position: fixed; inset: 0; background: rgba(28, 27, 24, 0.35);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10;
  }
  #recent-scrim.open { opacity: 1; pointer-events: auto; }
  #recent-drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: 400px; max-width: 92vw;
    background: var(--paper); border-left: 1px solid var(--hairline);
    transform: translateX(100%); transition: transform 0.25s ease; z-index: 11;
    display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(28, 27, 24, 0.06);
  }
  #recent-drawer.open { transform: translateX(0); }
  .recent-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--hairline); flex-shrink: 0;
  }
  .recent-header h2 { font-size: 0.95rem; margin: 0; font-weight: 600; }
  #recent-close-button { font-size: 1.1rem; line-height: 1; color: var(--muted); background: none; border: none; }
  #recent-close-button:hover { color: var(--ink); }
  .recent-list { overflow-y: auto; flex: 1; }
  .recent-row { padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--hairline); cursor: pointer; }
  .recent-row:hover { background: var(--row-hover); }
  .recent-row .inv-num { font-size: 0.85rem; }
  .recent-row .vendor { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
  .recent-row .meta-line {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted);
  }
  .recent-empty { padding: 1.5rem; color: var(--muted); font-size: 0.85rem; }
  .source-tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>

<header>
  <h1>Intelligent Invoice Processing</h1>
  <div class="header-actions hidden" id="header-actions">
    <span class="user-info mono" id="user-info"></span>
    <button type="button" class="btn-text" id="new-upload-button">+ New upload</button>
    <button type="button" class="btn-text" id="recent-toggle-button">Recent ▸</button>
    <button type="button" class="btn-text hidden" id="analytics-nav-button">Analytics</button>
    <button type="button" class="btn-text" id="logout-button">Log out</button>
  </div>
</header>

<main>
  <!-- Mounted by ../frontend (React) via window.LedgerReact.mountLogin(). -->
  <div id="login-view" class="hidden"></div>

  <div id="upload-view" class="hidden">
    <div id="upload-zone" tabindex="0">
      <p class="upload-hint">Drop a PDF invoice here, or click to browse</p>
      <button type="button" class="btn-primary" id="browse-button">Choose file</button>
      <p class="upload-subhint muted hidden" id="upload-filename"></p>
      <input type="file" id="file-input" accept="application/pdf" class="hidden" />
    </div>
    <p class="error-text hidden" id="upload-error"></p>
  </div>

  <div id="detail-view" class="hidden">
    <p class="source-line" id="source-line"></p>

    <section class="section">
      <h2 class="section-title">Extraction &amp; validation</h2>
      <div class="field-grid" id="invoice-fields"></div>
      <table class="ledger hidden" id="line-items-table">
        <thead>
          <tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="validation-issues"></div>
      <div id="status-history"></div>
    </section>

    <section class="section" id="investigate-section">
      <button class="btn-primary" id="investigate-button">Investigate with agent</button>
      <p class="error-text hidden" id="investigate-error"></p>
      <p class="muted hidden" id="investigate-loading" style="margin-top:0.85rem;">
        <span class="spinner"></span>Running agent investigation…
      </p>
    </section>

    <section class="section hidden" id="trace-section">
      <h2 class="section-title">Agent trace</h2>
      <div id="trace-terminal"></div>
    </section>

    <section class="section hidden" id="decision-section">
      <h2 class="section-title">Decision</h2>
      <div>
        <span class="status-line" id="decision-status-line"></span>
        <span class="decision-recommend" id="decision-recommend"></span>
      </div>
      <p class="termination-warning hidden" id="termination-warning"></p>
      <p class="decision-reasoning" id="decision-reasoning"></p>
      <div id="decision-concerns"></div>
      <p class="decision-meta" id="decision-meta"></p>

      <div id="human-actions" class="hidden">
        <div class="action-row" id="action-buttons">
          <button class="btn-primary" id="approve-post-button">Approve &amp; Post</button>
          <button class="btn-secondary" id="return-to-vendor-button">Return to Vendor</button>
        </div>
        <div id="return-reason-panel" class="hidden">
          <textarea id="return-reason-input" rows="2" placeholder="Reason for returning to vendor..."></textarea>
          <div class="action-row">
            <button class="btn-primary" id="confirm-return-button">Confirm return</button>
            <button class="btn-secondary" id="cancel-return-button">Cancel</button>
          </div>
        </div>
        <p class="error-text hidden" id="action-error"></p>
        <p class="hidden" id="action-result"></p>
      </div>
    </section>
  </div>

  <!-- Mounted by ../frontend (React) via window.LedgerReact.mountAnalytics(). -->
  <div id="analytics-view" class="hidden"></div>
</main>

<div id="recent-scrim"></div>
<div id="recent-drawer">
  <div class="recent-header">
    <h2>Recent invoices</h2>
    <button type="button" id="recent-close-button">✕</button>
  </div>
  <div class="recent-list" id="recent-list"></div>
</div>

<!--
  Built from ../frontend (React), see frontend/vite.config.ts -- fixed filename since
  this dir is served with Cache-Control: no-store (NoCacheStaticFiles in main.py), so
  there's nothing to cache-bust. Must load before the app script below: both are
  `type="module"` (deferred, run in document order after parsing) so window.LedgerReact
  is guaranteed to exist by the time checkAuthAndInit() calls into it.
-->
<script type="module" src="react/main.js"></script>
<script type="module">
  const el = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  let currentInvoiceId = null;
  let currentDecisionId = null;
  let currentUserRole = null;

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value == null ? "" : String(value);
    return div.innerHTML;
  }

  const STATUS_DOT = {
    valid: "good", invalid: "bad", pending_validation: "neutral",
    received: "neutral", validated: "neutral", pending_approval: "neutral",
    exception_workflow: "attention", posted: "good", rejected: "bad", returned_to_vendor: "bad",
    error: "bad", warning: "attention",
  };

  function statusLine(status) {
    const dotClass = STATUS_DOT[status] || "neutral";
    return `<span class="dot ${dotClass}"></span><span class="mono">${escapeHtml(status)}</span>`;
  }

  function formatStepTime(ms) {
    if (ms == null) return "--:--:--.---";
    const d = new Date(ms);
    const pad = (n, len = 2) => String(n).padStart(len, "0");
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
  }

  function formatDateTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString(undefined, {
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
    });
  }

  // --- view switching -------------------------------------------------------------------

  function clearAnalyticsHash() {
    if (location.hash === "#analytics") history.replaceState(null, "", location.pathname + location.search);
  }

  function showLoginView() {
    closeRecentDrawer();
    el("header-actions").classList.add("hidden");
    el("upload-view").classList.add("hidden");
    el("detail-view").classList.add("hidden");
    el("analytics-view").classList.add("hidden");
    el("login-view").classList.remove("hidden");
    window.LedgerReact.mountLogin();
  }

  function showUploadView() {
    currentInvoiceId = null;
    currentDecisionId = null;
    clearAnalyticsHash();
    el("login-view").classList.add("hidden");
    el("header-actions").classList.remove("hidden");
    el("detail-view").classList.add("hidden");
    el("analytics-view").classList.add("hidden");
    el("upload-view").classList.remove("hidden");
    el("upload-error").classList.add("hidden");
    el("upload-filename").classList.add("hidden");
    el("file-input").value = "";
  }

  function showDetailView() {
    clearAnalyticsHash();
    el("login-view").classList.add("hidden");
    el("header-actions").classList.remove("hidden");
    el("upload-view").classList.add("hidden");
    el("analytics-view").classList.add("hidden");
    el("detail-view").classList.remove("hidden");
  }

  function showAnalyticsView() {
    if (currentUserRole !== "manager") {
      showUploadView();
      return;
    }
    closeRecentDrawer();
    location.hash = "#analytics";
    el("login-view").classList.add("hidden");
    el("header-actions").classList.remove("hidden");
    el("upload-view").classList.add("hidden");
    el("detail-view").classList.add("hidden");
    el("analytics-view").classList.remove("hidden");
    window.LedgerReact.mountAnalytics();
  }

  function renderUserInfo(user) {
    currentUserRole = user.role;
    el("user-info").innerHTML =
      `${escapeHtml(user.username)} <span class="role">(${escapeHtml(user.role)})</span>`;
    el("analytics-nav-button").classList.toggle("hidden", user.role !== "manager");
  }

  async function checkAuthAndInit() {
    try {
      const response = await fetch("/auth/me");
      if (response.ok) {
        renderUserInfo(await response.json());
        if (location.hash === "#analytics") {
          showAnalyticsView();
        } else {
          showUploadView();
        }
      } else {
        showLoginView();
      }
    } catch (err) {
      showLoginView();
    }
  }

  el("analytics-nav-button").addEventListener("click", () => {
    // If the hash actually changes, the hashchange listener below calls
    // showAnalyticsView() -- if we're already there (hash unchanged), no event
    // fires, so call it directly to still refresh the data.
    if (location.hash === "#analytics") {
      showAnalyticsView();
    } else {
      location.hash = "#analytics";
    }
  });

  // Dispatched by the React login form (../frontend/src/LoginApp.tsx) after a
  // successful POST /auth/login -- the vanilla shell still owns header state and
  // view switching, so it reacts here rather than the React app knowing about them.
  window.addEventListener("ledger:login", (event) => {
    renderUserInfo(event.detail);
    showUploadView();
  });

  el("logout-button").addEventListener("click", async () => {
    await fetch("/auth/logout", { method: "POST" });
    showLoginView();
  });

  function resetInvestigationPanels() {
    el("trace-section").classList.add("hidden");
    el("decision-section").classList.add("hidden");
    el("trace-terminal").innerHTML = "";
    el("investigate-error").classList.add("hidden");
  }

  el("new-upload-button").addEventListener("click", showUploadView);

  // --- upload -----------------------------------------------------------------------------

  async function uploadFile(file) {
    if (!file) return;
    el("upload-error").classList.add("hidden");
    el("upload-filename").textContent = `Uploading ${file.name}…`;
    el("upload-filename").classList.remove("hidden");

    const formData = new FormData();
    formData.append("file", file);

    try {
      const response = await fetch("/invoices", { method: "POST", body: formData });
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || "Upload failed.");

      currentInvoiceId = body.id;
      showDetailView();
      resetInvestigationPanels();
      renderInvoice(body);
      loadRecentList();
    } catch (err) {
      el("upload-error").textContent = err.message;
      el("upload-error").classList.remove("hidden");
      el("upload-filename").classList.add("hidden");
    }
  }

  const uploadZone = el("upload-zone");
  const fileInput = el("file-input");

  uploadZone.addEventListener("click", (event) => {
    if (event.target.id !== "browse-button") fileInput.click();
  });
  el("browse-button").addEventListener("click", (event) => {
    event.stopPropagation();
    fileInput.click();
  });
  fileInput.addEventListener("change", () => uploadFile(fileInput.files[0]));

  ["dragenter", "dragover"].forEach((evt) =>
    uploadZone.addEventListener(evt, (event) => {
      event.preventDefault();
      uploadZone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    uploadZone.addEventListener(evt, (event) => {
      event.preventDefault();
      uploadZone.classList.remove("dragover");
    })
  );
  uploadZone.addEventListener("drop", (event) => {
    const file = event.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  // --- invoice detail rendering -----------------------------------------------------------

  async function refreshInvoiceFields() {
    // A human action (approve/return) changes decision_status and appends a new
    // status_history entry server-side -- re-fetch so the ledger fields at the top
    // don't sit stale showing the pre-action lifecycle status.
    if (!currentInvoiceId) return;
    try {
      const response = await fetch(`/invoices/${currentInvoiceId}`);
      if (response.ok) renderInvoice(await response.json());
    } catch (err) {
      console.error("Failed to refresh invoice fields", err);
    }
  }

  function renderInvoice(invoice) {
    const sourceLine = el("source-line");
    const sourceText = invoice.source === "gmail" ? "Received via Gmail" : "Uploaded manually";
    sourceLine.innerHTML = `✉ <strong>${escapeHtml(sourceText)}</strong> &middot; ${escapeHtml(invoice.source_filename || "")}`;

    const rows = [
      ["Invoice #", `<span class="mono">${escapeHtml(invoice.invoice_number)}</span>`],
      ["Vendor", escapeHtml(invoice.vendor_name)],
      ["Issue date", `<span class="mono">${escapeHtml(invoice.issue_date)}</span>`],
      ["Due date", `<span class="mono">${escapeHtml(invoice.due_date || "—")}</span>`],
    ];
    if (invoice.po_number) rows.push(["PO number", `<span class="mono">${escapeHtml(invoice.po_number)}</span>`]);
    if (invoice.company_code) rows.push(["Company code", `<span class="mono">${escapeHtml(invoice.company_code)}</span>`]);
    rows.push(["Total", `<span class="mono">${escapeHtml(invoice.currency)} ${escapeHtml(invoice.total_amount)}</span>`]);
    rows.push(["Validation", statusLine(invoice.status)]);
    rows.push(["Lifecycle", invoice.decision_status ? statusLine(invoice.decision_status) : "—"]);

    el("invoice-fields").innerHTML = rows.map(
      ([label, value]) => `<div class="field-row"><span class="label">${label}</span><span class="value">${value}</span></div>`
    ).join("");

    const lineItemsTable = el("line-items-table");
    if (invoice.line_items.length === 0) {
      lineItemsTable.classList.add("hidden");
    } else {
      lineItemsTable.classList.remove("hidden");
      document.querySelector("#line-items-table tbody").innerHTML = invoice.line_items.map(
        (item) => `<tr>
          <td>${escapeHtml(item.description)}</td>
          <td class="num mono">${escapeHtml(item.quantity)}</td>
          <td class="num mono">${escapeHtml(item.unit_price)}</td>
          <td class="num mono">${escapeHtml(item.extended_price)}</td>
        </tr>`
      ).join("");
    }

    const issuesEl = el("validation-issues");
    if (invoice.validation_issues.length === 0) {
      issuesEl.innerHTML = `<p class="muted" style="margin-top:1.25rem;">No validation issues.</p>`;
    } else {
      issuesEl.innerHTML = `<ul class="issue-list">${invoice.validation_issues.map(
        (issue) => `<li>
          <span class="mono issue-tag">[${escapeHtml(issue.step)}] ${escapeHtml(issue.rule_code)}</span>
          <span class="issue-severity">(${escapeHtml(issue.severity)})</span>
          <div class="issue-message">${escapeHtml(issue.message)}</div>
        </li>`
      ).join("")}</ul>`;
    }

    const historyEl = el("status-history");
    if (!invoice.status_history || invoice.status_history.length === 0) {
      historyEl.innerHTML = "";
    } else {
      historyEl.innerHTML = `<ul class="history-list">${invoice.status_history.map(
        (entry) => `<li>
          ${statusLine(entry.status)}
          <span class="ts mono">${escapeHtml(formatDateTime(entry.created_at))}</span>
          ${entry.reason ? `<span class="reason">${escapeHtml(entry.reason)}</span>` : ""}
        </li>`
      ).join("")}</ul>`;
    }
  }

  // --- agent trace (terminal log) ----------------------------------------------------------

  function renderTrace(steps) {
    const term = el("trace-terminal");
    if (!steps || steps.length === 0) {
      term.innerHTML = `<div class="trace-empty">No tool calls made.</div>`;
      return;
    }
    term.innerHTML = steps.map((step) => {
      const argsStr = JSON.stringify(step.arguments);
      const resultStr = step.result != null ? JSON.stringify(step.result) : "null";
      const isWarn = !!(step.result && (step.result.rejected_reason || step.result.error));
      return `
        <div class="trace-call-line"><span class="trace-ts">${formatStepTime(step.timestamp_ms)}</span><span class="trace-call">&rarr; ${escapeHtml(step.tool)}(${escapeHtml(argsStr)})</span></div>
        <div class="trace-result-line"><span class="trace-ts-spacer">${" ".repeat(12)}</span><span class="trace-result${isWarn ? " warn" : ""}">&larr; ${escapeHtml(resultStr)}</span></div>
      `;
    }).join("");
  }

  // --- decision -----------------------------------------------------------------------------

  const TERMINATION_LABELS = {
    max_turns_exceeded: "⚠ Hit the tool-call turn cap before reaching a recommendation",
    timeout: "⚠ An OpenAI call timed out during this investigation",
  };

  function renderDecision(investigation, liveDecisionStatus) {
    currentDecisionId = investigation.decision_id;
    // investigation.decision_status is a point-in-time snapshot from when the agent
    // investigated -- a human may have since resolved it (approved/returned), moving
    // the invoice's *current* decision_status past exception_workflow. Action buttons
    // must gate on the invoice's live status (passed in when loading an existing
    // invoice from the list), not the stale snapshot, or "Approve & Post" gets shown
    // for an invoice that's already posted and predictably 409s when clicked.
    const effectiveStatus = liveDecisionStatus || investigation.decision_status;

    el("decision-status-line").innerHTML = statusLine(investigation.decision_status);
    el("decision-recommend").textContent = `agent recommended: ${investigation.recommendation}`;
    el("decision-reasoning").textContent = investigation.reasoning_summary;

    const warningEl = el("termination-warning");
    const warningText = TERMINATION_LABELS[investigation.termination_reason];
    if (warningText) {
      warningEl.textContent = warningText;
      warningEl.classList.remove("hidden");
    } else {
      warningEl.classList.add("hidden");
    }

    const concernsEl = el("decision-concerns");
    concernsEl.innerHTML = investigation.concerns.length
      ? investigation.concerns.map((c) => `<span class="concern-tag mono">${escapeHtml(c)}</span>`).join("")
      : `<span class="muted">No concerns flagged.</span>`;

    const tokens = investigation.total_tokens != null ? `${investigation.total_tokens} tokens` : "token usage unavailable";
    el("decision-meta").textContent =
      `${investigation.model} · ${investigation.tool_call_count} tool calls · ${tokens} · ` +
      `${investigation.latency_ms}ms · policy ${investigation.policy_version} · ${investigation.termination_reason}`;

    // Reset the human-action panel for this decision.
    el("action-error").classList.add("hidden");
    el("action-result").classList.add("hidden");
    el("return-reason-panel").classList.add("hidden");
    el("return-reason-input").value = "";
    el("action-buttons").classList.remove("hidden");
    el("approve-post-button").disabled = false;
    el("return-to-vendor-button").disabled = false;

    // UI-side gate for a clean clerk experience -- the real enforcement is server-side
    // (RequireManager on POST .../execute), not this. A clerk simply never sees these
    // buttons; hiding them here is not what makes them unusable.
    const canAct = effectiveStatus === "exception_workflow" && currentUserRole === "manager";
    el("human-actions").classList.toggle("hidden", !canAct);

    el("decision-section").classList.remove("hidden");
  }

  async function executeDecision(action, reason) {
    el("action-error").classList.add("hidden");
    el("approve-post-button").disabled = true;
    el("return-to-vendor-button").disabled = true;
    el("confirm-return-button").disabled = true;

    try {
      const response = await fetch(
        `/invoices/${currentInvoiceId}/decisions/${currentDecisionId}/execute`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, reason: reason || null }),
        }
      );
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || "Action failed.");

      el("action-buttons").classList.add("hidden");
      el("return-reason-panel").classList.add("hidden");

      const resultEl = el("action-result");
      resultEl.textContent =
        action === "post" ? "✓ Approved and posted by human review." : `✓ Returned to vendor: ${body.reason}`;
      resultEl.classList.remove("hidden");
      loadRecentList();
      refreshInvoiceFields();
    } catch (err) {
      el("action-error").textContent = err.message;
      el("action-error").classList.remove("hidden");
      el("approve-post-button").disabled = false;
      el("return-to-vendor-button").disabled = false;
      el("confirm-return-button").disabled = false;
    }
  }

  el("approve-post-button").addEventListener("click", () => executeDecision("post", null));

  el("return-to-vendor-button").addEventListener("click", () => {
    el("return-reason-panel").classList.remove("hidden");
  });

  el("cancel-return-button").addEventListener("click", () => {
    el("return-reason-panel").classList.add("hidden");
  });

  el("confirm-return-button").addEventListener("click", () => {
    const reason = el("return-reason-input").value.trim();
    if (!reason) {
      el("action-error").textContent = "Please provide a reason before confirming.";
      el("action-error").classList.remove("hidden");
      return;
    }
    executeDecision("return", reason);
  });

  el("investigate-button").addEventListener("click", async () => {
    if (!currentInvoiceId) return;

    el("investigate-error").classList.add("hidden");
    el("investigate-button").disabled = true;
    el("investigate-loading").classList.remove("hidden");
    resetInvestigationPanels();

    try {
      const response = await fetch(`/invoices/${currentInvoiceId}/investigate`, { method: "POST" });
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || "Investigation failed.");

      el("trace-section").classList.remove("hidden");
      renderTrace(body.steps);
      await sleep(300);
      renderDecision(body);
      loadRecentList();
    } catch (err) {
      el("investigate-error").textContent = err.message;
      el("investigate-error").classList.remove("hidden");
    } finally {
      el("investigate-button").disabled = false;
      el("investigate-loading").classList.add("hidden");
    }
  });

  // --- recent invoices drawer --------------------------------------------------------------

  async function loadInvoiceById(id) {
    el("upload-error").classList.add("hidden");
    resetInvestigationPanels();

    try {
      const response = await fetch(`/invoices/${id}`);
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || "Failed to load invoice.");

      currentInvoiceId = id;
      showDetailView();
      renderInvoice(body);

      const investigationResponse = await fetch(`/invoices/${id}/investigation`);
      if (investigationResponse.ok) {
        const investigation = await investigationResponse.json();
        el("trace-section").classList.remove("hidden");
        renderTrace(investigation.steps);
        renderDecision(investigation, body.decision_status);
      }
    } catch (err) {
      showUploadView();
      el("upload-error").textContent = err.message;
      el("upload-error").classList.remove("hidden");
    }
  }

  async function loadRecentList() {
    try {
      const response = await fetch("/invoices?limit=20");
      const invoices = await response.json();
      const listEl = el("recent-list");

      if (invoices.length === 0) {
        listEl.innerHTML = `<div class="recent-empty">No invoices yet.</div>`;
        return;
      }
      listEl.innerHTML = invoices.map((inv) => {
        const sourceLabel = inv.source === "gmail" ? "✉ gmail" : "📄 manual";
        return `
          <div class="recent-row" data-id="${inv.id}">
            <div class="inv-num mono">${escapeHtml(inv.invoice_number)}</div>
            <div class="vendor">${escapeHtml(inv.vendor_name)}</div>
            <div class="meta-line">
              ${statusLine(inv.decision_status || inv.status)}
              <span class="source-tag">${sourceLabel}</span>
            </div>
          </div>
        `;
      }).join("");
    } catch (err) {
      console.error("Failed to load recent invoices", err);
    }
  }

  function openRecentDrawer() {
    loadRecentList();
    el("recent-drawer").classList.add("open");
    el("recent-scrim").classList.add("open");
  }
  function closeRecentDrawer() {
    el("recent-drawer").classList.remove("open");
    el("recent-scrim").classList.remove("open");
  }

  el("recent-toggle-button").addEventListener("click", openRecentDrawer);
  el("recent-close-button").addEventListener("click", closeRecentDrawer);
  el("recent-scrim").addEventListener("click", closeRecentDrawer);

  el("recent-list").addEventListener("click", (event) => {
    const row = event.target.closest(".recent-row[data-id]");
    if (!row) return;
    closeRecentDrawer();
    loadInvoiceById(row.dataset.id);
  });

  // --- analytics (manager only) --------------------------------------------------------
  // Rendering lives in React now -- see ../frontend/src/AnalyticsApp.tsx, mounted via
  // window.LedgerReact.mountAnalytics() in showAnalyticsView() above.

  window.addEventListener("hashchange", () => {
    if (location.hash === "#analytics") {
      showAnalyticsView();
    } else if (!el("analytics-view").classList.contains("hidden")) {
      showUploadView();
    }
  });

  checkAuthAndInit();
</script>
</body>
</html>
