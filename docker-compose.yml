services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice_app
      POSTGRES_PASSWORD: invoice_app
      POSTGRES_DB: invoice_processing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_app -d invoice_processing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
